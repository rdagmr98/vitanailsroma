name: booking
on:
  repository_dispatch:
    types: [book, admin_book, accept, decline, cancel, change_password, update_slots]
concurrency:
  group: vita-bookings
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/booking.py
      - run: |
          git config user.name "vita-booking"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bookings.json data/admin.json data/slots.json data/availability.json
          git diff --staged --quiet && exit 0
          git commit -m "prenotazione: aggiorna dati"
          git pull --rebase --autostash
          git push
