name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject GhDb token (SMAM-style, like corsi READ_PAT)
        env:
          VITA_BOOKING_PAT: ${{ secrets.VITA_BOOKING_PAT }}
        run: |
          if [ -z "$VITA_BOOKING_PAT" ]; then
            echo "Missing secret VITA_BOOKING_PAT"
            exit 1
          fi
          python3 - <<'PY'
          import os, json, pathlib
          token = os.environ["VITA_BOOKING_PAT"]
          pathlib.Path("js/runtime-config.js").write_text(
              "window.VITA_GH = {\n"
              '  owner: "rdagmr98",\n'
              '  repo: "vitanailsroma",\n'
              '  path: "data",\n'
              f"  token: {json.dumps(token)},\n"
              "};\n",
              encoding="utf-8",
          )
          PY
      - name: Stage site
        run: |
          mkdir -p _site/js _site/css _site/data
          cp -f *.html sitemap.xml robots.txt _site/ 2>/dev/null || true
          cp -rf css/. _site/css/
          cp -rf js/. _site/js/
          cp -rf data/. _site/data/
          # Site images live here (not media/)
          if [ -d vita-nails-media ]; then cp -rf vita-nails-media _site/; fi
          if [ -d media ]; then cp -rf media _site/; fi
          if [ -d assets ]; then cp -rf assets _site/; fi
          ls -la _site
          test -d _site/vita-nails-media
          test -n "$(ls -A _site/vita-nails-media | head -1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
