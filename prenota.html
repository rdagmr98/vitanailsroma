<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenota — Vita Nails Roma</title>
  <link rel="canonical" href="https://rdagmr98.github.io/vitanailsroma/prenota.html">
  <meta name="description" content="Prenota manicure, pedicure o podologia da Vita Nails Roma. Scegli uno slot libero e ricevi conferma.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/booking.css">
</head>
<body>
  <div class="container">
    <div class="top">
      <a class="logo" href="index.html">Vita <span>Nails</span></a>
      <div>
        <button type="button" class="lang-btn active" data-lang="it">IT</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
      </div>
    </div>
    <h1 id="tTitle">Prenota uno slot</h1>
    <p class="sub" id="tSub">Vedi solo se lo slot è libero o occupato. La prima richiesta tiene lo slot; Vita conferma o rifiuta.</p>
    <p><a href="index.html#contatti" id="tIg">Oppure scrivi su Instagram</a></p>

    <div class="card">
      <label for="service" id="lService">Trattamento</label>
      <select id="service"></select>
      <label id="lSlots">Orari</label>
      <div class="cal-nav">
        <button type="button" class="btn btn-outline" id="weekPrev">←</button>
        <strong id="weekLabel"></strong>
        <button type="button" class="btn btn-outline" id="weekNext">→</button>
      </div>
      <div class="cal-week" id="slots"></div>
      <label for="name" id="lName">Nome</label>
      <input id="name" maxlength="80" autocomplete="name">
      <label for="note" id="lNote">Nota (opzionale)</label>
      <input id="note" maxlength="200">
      <div class="row">
        <button type="button" class="btn btn-primary" id="bookBtn">Richiedi prenotazione</button>
      </div>
      <p class="err" id="err" hidden></p>
      <p class="ok" id="ok" hidden></p>
    </div>

    <div class="card">
      <label for="lookup" id="lLookup">Hai già un codice?</label>
      <input id="lookup" placeholder="VN-XXXXXX">
      <div class="row">
        <button type="button" class="btn btn-outline" id="lookupBtn">Controlla stato</button>
      </div>
      <p id="lookupOut"></p>
    </div>
  </div>
  <script src="js/runtime-config.js"></script>
  <script src="js/ghdb.js"></script>
  <script src="js/booking.js"></script>
  <script>
    const I18N = {
      it: {
        title: "Prenota uno slot",
        sub: "Calendario settimane → giorni → orari. Libero/occupato visibile; Vita conferma o rifiuta.",
        ig: "Oppure scrivi su Instagram",
        service: "Trattamento", slots: "Orari", name: "Nome", note: "Nota (opzionale)",
        book: "Richiedi prenotazione", lookup: "Hai già un codice?", check: "Controlla stato",
        taken: "occupato", free: "libero",
        errToken: "Prenotazione online non attiva. Contatta chi gestisce il sito.",
        errTaken: "Slot appena occupato, scegline un altro.",
        err: "Richiesta non inviata. Riprova o usa Instagram.",
        wait: "Invio in corso...",
        done: (c) => `Richiesta inviata. Conserva il codice ${c} — in attesa di Vita.`,
        noSlot: "Scegli data/ora e scrivi il nome.",
        notfound: "Codice non trovato.",
        st: { pending: "in attesa", confirmed: "confermata", declined: "rifiutata", expired: "scaduta", cancelled: "annullata" }
      },
      ru: {
        title: "Запись на слот",
        sub: "Календарь: недели → дни → время. Свободно/занято видно; Вита подтверждает или отклоняет.",
        ig: "Или напишите в Instagram",
        service: "Процедура", slots: "Время", name: "Имя", note: "Заметка (необязательно)",
        book: "Отправить заявку", lookup: "Уже есть код?", check: "Проверить статус",
        taken: "занято", free: "свободно",
        errToken: "Онлайн-запись не активна. Напишите в Instagram.",
        errTaken: "Слот только что заняли, выберите другой.",
        err: "Не удалось отправить. Повторите или Instagram.",
        wait: "Отправка...",
        done: (c) => `Заявка отправлена. Код ${c} — ожидание Виты.`,
        noSlot: "Выберите время и укажите имя.",
        notfound: "Код не найден.",
        st: { pending: "ожидание", confirmed: "подтверждено", declined: "отклонено", expired: "истекло", cancelled: "отменено" }
      }
    };
    let lang = localStorage.getItem("vn-lang") || "it";
    let t = I18N[lang];
    let sel = "";
    let weekOff = 0;
    let services = [];
    let hoursCfg = null;
    let intervals = [];

    function loc() { return lang === "ru" ? "ru-RU" : "it-IT"; }

    function apply() {
      t = I18N[lang];
      document.documentElement.lang = lang;
      tTitle.textContent = t.title; tSub.textContent = t.sub; tIg.textContent = t.ig;
      lService.textContent = t.service; lSlots.textContent = t.slots; lName.textContent = t.name;
      lNote.textContent = t.note; lLookup.textContent = t.lookup;
      bookBtn.textContent = t.book; lookupBtn.textContent = t.check;
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
      service.innerHTML = services.map(s =>
        `<option value="${s.id}">${s[lang]} ${s.price}${s.duration ? " · " + s.duration + "′" : ""}</option>`
      ).join("");
      paintWeek();
    }
    document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => {
      lang = b.dataset.lang; localStorage.setItem("vn-lang", lang); apply();
    }));

    function paintWeek() {
      if (!hoursCfg) return;
      const mon = VitaBook.mondayOf(new Date());
      mon.setDate(mon.getDate() + weekOff * 7);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const opts = { day: "numeric", month: "short" };
      weekLabel.textContent = `${mon.toLocaleDateString(loc(), opts)} – ${sun.toLocaleDateString(loc(), opts)}`;
      const today = VitaBook.ymd(new Date());
      const dur = VitaBook.serviceDuration(services, service.value);
      const list = VitaBook.expandSlots(hoursCfg, dur, intervals);
      const byDay = {};
      for (const s of list) {
        const key = VitaBook.ymd(s.t);
        (byDay[key] || (byDay[key] = [])).push(s);
      }
      const cells = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(mon); d.setDate(mon.getDate() + i);
        const key = VitaBook.ymd(d);
        const daySlots = byDay[key] || [];
        const btns = daySlots.map(s =>
          `<button type="button" class="cal-slot${s.id === sel ? " sel" : ""}" data-id="${s.id}" ${s.taken ? "disabled" : ""} title="${s.taken ? t.taken : t.free}">${VitaBook.hhmm(s.t)}</button>`
        ).join("");
        cells.push(`<div class="cal-day${daySlots.length ? "" : " muted"}${key === today ? " today" : ""}">
          <div class="cal-day-h">${d.toLocaleDateString(loc(), { weekday: "short" })}<strong>${d.getDate()}/${d.getMonth() + 1}</strong></div>
          ${btns || ""}
        </div>`);
      }
      slots.innerHTML = cells.join("");
      slots.querySelectorAll(".cal-slot:not(:disabled)").forEach(btn => btn.addEventListener("click", () => {
        sel = btn.dataset.id;
        slots.querySelectorAll(".cal-slot").forEach(x => x.classList.toggle("sel", x === btn));
      }));
    }

    async function renderSlots() {
      const [cfg, av] = await Promise.all([VitaBook.loadJson("slots.json"), VitaBook.loadJson("availability.json")]);
      hoursCfg = cfg;
      intervals = [...(av.busy || []), ...(av.blocks || [])];
      if ((!av.busy || !av.busy.length) && av.occupied && av.occupied.length) {
        intervals = av.occupied.map(id => {
          const t = VitaBook.parseSlotId(id);
          return t ? { start: id, end: VitaBook.slotIdOf(VitaBook.addMins(t, 60)) } : null;
        }).filter(Boolean);
      }
      paintWeek();
    }

    weekPrev.addEventListener("click", () => { weekOff = Math.max(0, weekOff - 1); paintWeek(); });
    weekNext.addEventListener("click", () => { weekOff++; paintWeek(); });
    service.addEventListener("change", () => { sel = ""; paintWeek(); });

    function newCode() {
      return "VN-" + [...crypto.getRandomValues(new Uint8Array(3))].map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    }

    bookBtn.addEventListener("click", async () => {
      err.hidden = ok.hidden = true;
      const name = document.getElementById("name").value.trim();
      if (!sel || !name) { err.hidden = false; err.textContent = t.noSlot; return; }
      const code = newCode();
      ok.hidden = false; ok.textContent = t.wait;
      try {
        const b = await VitaBook.api("book", { name, slotId: sel, serviceId: service.value, note: note.value.trim(), code });
        if (b.status === "pending") ok.textContent = t.done(b.code || code);
        else { err.hidden = false; err.textContent = t.errTaken; ok.hidden = true; }
        await renderSlots();
      } catch (e) {
        err.hidden = false;
        err.textContent = e.message === "noapi" ? t.errToken : (e.message === "taken" ? t.errTaken : t.err);
        ok.hidden = true;
      }
    });

    lookupBtn.addEventListener("click", async () => {
      const code = lookup.value.trim().toUpperCase();
      const av = await VitaBook.loadJson("availability.json");
      const b = av.codes && av.codes[code];
      lookupOut.textContent = b ? `${code} · ${b.slotId} · ${t.st[b.status] || b.status}` : t.notfound;
      lookupOut.className = b ? "status " + b.status : "err";
    });

    (async () => {
      services = await VitaBook.loadJson("services.json");
      apply();
      await renderSlots();
    })();
  </script>
</body>
</html>
